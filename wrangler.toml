name = "chibi-ludo-3d"
main = "worker/index.ts"
compatibility_date = "2026-03-01"
routes = [
  { pattern = "ludo.inkfinitystudio.store", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

[[durable_objects.bindings]]
name = "LUDO_ROOM"
class_name = "LudoRoomDO"

[[durable_objects.bindings]]
name = "PLAYER_WALLET"
class_name = "PlayerWalletDO"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerDO"

[[durable_objects.bindings]]
name = "PLAYER_ACCOUNT"
class_name = "AccountDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlayerWalletDO", "MatchmakerDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AccountDO"]

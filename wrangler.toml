name = "chibi-ludo-3d"
main = "worker/index.ts"
compatibility_date = "2026-03-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

[[durable_objects.bindings]]
name = "LUDO_ROOM"
class_name = "LudoRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoomDO"]
